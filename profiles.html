<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile page</title>
    <link rel="stylesheet" href="profiles.css" />
  </head>
  <body>
    <section class="profile-selection-section">
      <div class="profile-container">
        <h1 class="profile-main-title">Who's watching?</h1>

        <ul class="profile-list">
          <li class="profile-item">
            <a href="#" class="profile-link">
              <div class="avatar-wrapper green-avatar">
                <div class="monster-eye eye-top-left"></div>
                <div class="monster-eye eye-main"></div>
                <div class="monster-eye eye-bottom-left"></div>
                <div class="monster-smile"></div>
              </div>
              <span class="profile-name">User 1</span>
            </a>
          </li>

          <li class="profile-item">
            <a href="#" class="profile-link">
              <div class="avatar-wrapper red-avatar">
                <div class="classic-eye eye-left"></div>
                <div class="classic-eye eye-right"></div>
                <div class="classic-smile"></div>
              </div>
              <span class="profile-name">User 2</span>
            </a>
          </li>

          <li class="profile-item">
            <a href="#" class="profile-link">
              <div class="avatar-wrapper yellow-avatar">
                <div class="classic-eye eye-left"></div>
                <div class="classic-eye eye-right"></div>
                <div class="classic-smile"></div>
              </div>
              <span class="profile-name">User 3</span>
            </a>
          </li>

          <li class="profile-item">
            <a href="#" class="profile-link">
              <div class="avatar-wrapper blue-avatar">
                <div class="classic-eye eye-left"></div>
                <div class="classic-eye eye-right"></div>
                <div class="classic-smile"></div>
              </div>
              <span class="profile-name">User 4</span>
            </a>
          </li>

          
        </ul>

        <div class="manage-profiles-action">
          <button class="manage-profiles-btn">Manage Profiles</button>
        </div>
      </div>
    </section>
  </body>
</html>
